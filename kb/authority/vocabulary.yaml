# CC-Harness KB — Controlled Vocabulary (Authority File)
# ----------------------------------------------------------------------------
# A library-science authority file for the `tags:` frontmatter field used
# across every OKF bundle in kb/. It records the *preferred term* (descriptor)
# for each concept and the *non-preferred terms* (entry terms) that should
# resolve to it — the same USE / UF (Used-For) apparatus a thesaurus uses to
# collapse spelling variants and synonyms so that retrieval by tag does not
# lose recall to vocabulary drift.
#
# This is an APPLICATION PROFILE layer on top of OKF. OKF itself is
# deliberately minimal ("consumers must tolerate unknown tags"); this file
# adds an opt-in, stricter conformance target enforced by
# `.claude/skills/okf-wikify/scripts/lint_authority.py` — in ADVISORY mode for
# tags; an unregistered `type` (below) is an error.
#
# Adoption is incremental, exactly like a real cataloging department: we do
# not enumerate every keyword up front. We seed the cross-cutting vocabulary
# and the known variant collisions, let the linter surface new candidates
# ("unaccessioned terms"), and accession them here as they prove load-bearing.
#
# Schema
# ------
# facets:            ordered list of the top-level facets (subject dimensions).
# form:              rules for the *form of headings* (how a tag is spelled).
#   preferred_case:  "lower-kebab" — headings are lowercase, hyphen-separated.
#   form_exceptions: surface forms allowed to keep mixed case / symbols
#                    (proper nouns, acronyms, language names).
# terms:             the descriptors. Each key IS the preferred term.
#   facet:           which facet it belongs to.
#   scope_note:      (optional) how the term is meant to be used — a cataloger's
#                    scope note (SN). Present for the load-bearing terms.
#   use_for:         (optional) non-preferred entry terms (UF). Any tag in this
#                    list is a VARIANT and should be rewritten to the descriptor.
#   broader:         (optional) broader terms (BT) — hierarchical parents.
#   related:         (optional) related terms (RT) — associative cross-refs.
# ----------------------------------------------------------------------------

facets:
  - domain        # subject area a file belongs to
  - agent         # agentic / AI-native engineering concepts
  - process       # git + development process
  - artifact      # genre of knowledge (mirrors OKF `type`, in tag form)
  - technique     # methods / operations (CAD, geometry, manufacturing)
  - material      # feedstock / physical materials
  - math          # mathematical foundations

# reviewed_distinct: pairs the COLLISION heuristic flags as look-alikes but a
# human has confirmed are genuinely different concepts. The linter skips these.
# A cataloger's record of "yes, we looked; keep them separate."
reviewed_distinct:
  - [dynamic, dynamics]   # dynamic (programming) vs dynamics (physics/motion)

form:
  preferred_case: lower-kebab
  form_exceptions:
    - WebGPU
    - OpenCASCADE
    - OpenSCAD
    - C++
    - DSL
    - BSP
    - UI
    - UX
    - PID
    - FEA
    - FEM
    - NURBS        # tolerated form; the descriptor below is lowercase `nurbs`

# ----------------------------------------------------------------------------
# Registered `type` vocabulary (CLOSED).
# ----------------------------------------------------------------------------
# Unlike `tags` — an OPEN vocabulary that grows by accession, where an
# un-listed term is merely a candidate — the OKF `type` field draws from a
# FIXED registry. Every file's `type` must be one of `registered`, or a
# `use_for` alias that resolves to one. lint_authority.py reports any other
# value by default (not only under --report) and exits 1, because the set is
# meant to be complete: a new genre is a deliberate addition here, not silent
# drift.
#
# `type` names the *genre* of a knowledge record (its Dublin Core dc:type).
# `tags` (below) name its *subject*. Keep the two jobs separate.
types:
  registered:
    - Concept        # an abstract idea, principle, or definition
    - Reference      # structured lookup material (specs, field tables)
    - Playbook       # an ordered procedure to follow
    - Lesson         # a concrete gotcha from a real session, with context
    - Policy         # a prescriptive rule (MUST / MUST NOT)
    - Process        # a workflow / how-we-do-it description
    - Methodology    # a named approach or method
    - Architecture   # structural description of a system or layout
    - Mechanism      # how a physical / engineering thing works
    - Algorithm      # a computational method
    - Model          # a mathematical or conceptual model
    - Theory         # theoretical foundation
    - Technology     # a tool or technology description
    - Analysis       # an analytical study or investigation
    - Code Example   # a worked code sample
    - Work Item      # a PDLC backlog entry: epic, story, spike, or ticket
    - Journal        # a dated record written as the work happens (running or ceremony journal)
  use_for:           # non-preferred type -> registered type
    Example: Code Example
    Workflow: Process
    Guide: Reference
    # PDLC names a session naturally reaches for — resolved to the registered
    # genre so lint_authority can say which one to use.
    Ticket: Work Item
    Epic: Work Item
    Story: Work Item
    Spike: Work Item
    Log: Journal
    Roadmap: Playbook

# ----------------------------------------------------------------------------
# Relationship-type vocabulary (for the OKF `relationships:` field).
# ----------------------------------------------------------------------------
# Typed edges between records — the FRBR/LRM layer. Use SPARINGLY: reach for a
# typed edge only when an agent needs to QUERY the relationship mechanically
# (e.g. "is this superseded?", "what governs this?"). Ordinary "see also"
# cross-references stay plain markdown links in the body, per the OKF spec.
#
# Frontmatter shape:
#   relationships:
#     - type: ELABORATES
#       target: /concepts/progressive-disclosure.md   # bundle-relative or ./relative
#
# relationships.py validates that `type` is registered and `target` resolves,
# and answers the queries the edges enable. Each edge type records its inverse
# so the graph can be traversed both ways.
relationship_types:
  SUPERSEDES:     {inverse: SUPERSEDED_BY, scope_note: "This record replaces the target; the target is obsolete."}
  SUPERSEDED_BY:  {inverse: SUPERSEDES,    scope_note: "This record is obsolete; the target replaces it. Pair with status: deprecated."}
  GOVERNS:        {inverse: GOVERNED_BY,   scope_note: "This record's rules constrain the target."}
  GOVERNED_BY:    {inverse: GOVERNS,       scope_note: "This record is subject to the policy in the target."}
  IMPLEMENTS:     {inverse: IMPLEMENTED_BY, scope_note: "This record realizes the concept/spec in the target."}
  IMPLEMENTED_BY: {inverse: IMPLEMENTS,    scope_note: "The target realizes the concept/spec in this record."}
  ELABORATES:     {inverse: ELABORATED_BY, scope_note: "This record expands on / reframes the target (a related FRBR expression)."}
  ELABORATED_BY:  {inverse: ELABORATES,    scope_note: "The target expands on this record."}
  DERIVED_FROM:   {inverse: SOURCE_OF,     scope_note: "This record's content was derived from the target."}
  SOURCE_OF:      {inverse: DERIVED_FROM,  scope_note: "The target was derived from this record."}
  PART_OF:        {inverse: HAS_PART,      scope_note: "This record is a component of the larger work at target."}
  HAS_PART:       {inverse: PART_OF,       scope_note: "The target is a component of this record."}
  # PDLC work-item sequencing. A DEPENDS_ON edge is queried to order the
  # backlog, so it earns a typed edge rather than a prose "Depends on:" line.
  DEPENDS_ON:     {inverse: BLOCKS,        scope_note: "This work item cannot be finished until the target work item is done."}
  BLOCKS:         {inverse: DEPENDS_ON,    scope_note: "The target work item cannot be finished until this one is done."}

# Valid `status` values (OKF domain-extension overlay). A record with
# status: deprecated should also carry a SUPERSEDED_BY edge where one exists.
# `status` is the lifecycle of the *record* (is this document current?).
statuses: [draft, review, finalized, deprecated]

# Valid `state` values for `type: Work Item` records. `state` is the lifecycle
# of the *work* the record tracks (is this ticket finished?) — deliberately a
# separate field from `status`, because a done ticket is still a finalized,
# current record. relationships.py validates both fields.
work_item_states: [open, active, blocked, done, declined]

terms:

  # ---- domain --------------------------------------------------------------
  library-science:
    facet: domain
    scope_note: >
      Application of Library & Information Science (cataloging, authority
      control, metadata, IR) to the agentic harness itself.
    related: [knowledge-base, authority-control, metadata]
  knowledge-base:
    facet: domain
    scope_note: The KB / OKF machinery itself (structure, navigation, governance).
    use_for: [kb, knowledgebase]
  okf:
    facet: domain
    scope_note: Open Knowledge Format — the bundle format kb/ is written in.
  additive-engineering:
    facet: domain
    use_for: [additive]
    related: [additive-manufacturing]
  deploy:
    facet: domain
    scope_note: Shipping code to a runtime (Workers, Vercel, Fly, ...).
    use_for: [deployment]
  ai-sdlc:
    facet: domain
    use_for: [pdlc, ai-dlc]

  # ---- agent ---------------------------------------------------------------
  agent:
    facet: agent
    scope_note: Agentic-execution concepts — how an AI session behaves/decides.
    use_for: [agents, agentic]
  context-management:
    facet: agent
    scope_note: Deliberate control of what enters the model's context window.
    use_for: [context]
    related: [progressive-disclosure, memory]
  progressive-disclosure:
    facet: agent
    scope_note: Loading two or three KB files per question, never the whole tree.
    related: [context-management, information-retrieval]
  memory:
    facet: agent
    scope_note: Durable, repository-resident knowledge (vs ephemeral chat).
    related: [context-management]
  prompting:
    facet: agent
    use_for: [prompt, prompts]

  # ---- process -------------------------------------------------------------
  git:
    facet: process
    use_for: [version-control]
  pull-requests:
    facet: process
    use_for: [pull-request, pr, prs]
  branching:
    facet: process
    use_for: [branch, branches]
  commits:
    facet: process
    use_for: [commit]
  verification:
    facet: process
    scope_note: Explicitly checking generated output against the spec.
    use_for: [verify, validation, validate]
  workflow:
    facet: process
    use_for: [process]
  governance:
    facet: process
    scope_note: Rules that constrain how agents/humans change the repo.
    use_for: [policy]
  backlog:
    facet: process
    scope_note: PDLC work items (epics, stories, spikes, tickets) and their index.
    use_for: [ticket, tickets, work-items]
  milestone:
    facet: process
    scope_note: A roadmap checkpoint with an exit criterion; the unit of owner check-ins.
    use_for: [milestones]
  spike:
    facet: process
    scope_note: A time-boxed investigation of an unknown, recorded in a spike JOURNAL.md.
    use_for: [spikes]
  journal:
    facet: process
    scope_note: A dated record written as work happens — running journal or ceremony journal.
    use_for: [journals, running-journal, build-log]
  handoff:
    facet: process
    scope_note: The living cold-start brief a fresh session reads first.
    use_for: [handoffs, cold-start]
  facilitation:
    facet: process
    scope_note: The role the primary session plays to run a review ceremony — dispatch, fan-in, synthesis.
    use_for: [facilitator]
  ceremony:
    facet: process
    scope_note: A review event (kickoff, alignment, triage, investigation) whose outputs live in kb/alignment/<slug>/.
    use_for: [ceremonies, retro, retrospective]

  # ---- artifact (genre of knowledge; parallels OKF `type`) -----------------
  concept:
    facet: artifact
    use_for: [concepts]
  lesson:
    facet: artifact
    scope_note: A concrete thing that bit us in a real session, with context.
    use_for: [lessons, gotcha, gotchas]
  playbook:
    facet: artifact
    use_for: [playbooks, recipe, recipes]
  reference:
    facet: artifact
    use_for: [references]

  # ---- library-science method terms (dogfooding: used by this bundle) ------
  authority-control:
    facet: library-science
    scope_note: One authorized form per concept; variants resolve to it.
    related: [controlled-vocabulary, metadata]
  controlled-vocabulary:
    facet: library-science
    use_for: [controlled-vocab, thesaurus, taxonomy]
    related: [authority-control, faceted-classification]
  faceted-classification:
    facet: library-science
    scope_note: Classifying by independent facets rather than one rigid tree.
    related: [classification, controlled-vocabulary]
  classification:
    facet: library-science
    related: [faceted-classification, knowledge-organization]
  knowledge-organization:
    facet: library-science
    related: [classification, metadata]
  metadata:
    facet: library-science
    # NB: the bare tag `meta` is NOT a variant of this — in kb/concepts it means
    # "meta / self-referential" (docs about the KB itself), a distinct concept.
    related: [application-profile, crosswalk]
  application-profile:
    facet: library-science
    scope_note: A tightened, domain-specific use of a base metadata standard.
    related: [metadata, okf]
  crosswalk:
    facet: library-science
    scope_note: A mapping of one metadata scheme's fields onto another's.
    related: [metadata]
  information-retrieval:
    facet: library-science
    use_for: [ir, retrieval, search]
    related: [progressive-disclosure]
  frbr:
    facet: library-science
    scope_note: Work / Expression / Manifestation / Item entity model (and LRM).
    use_for: [lrm]
    related: [knowledge-organization]
  collection-development:
    facet: library-science
    scope_note: Selection, weeding (deaccession), and provenance of KB material.
    use_for: [weeding, deaccession]
    related: [provenance]
  provenance:
    facet: library-science
    scope_note: Where a claim came from and how it can be traced back.
    related: [collection-development, metadata]
  roadmap:
    facet: library-science
    use_for: [road-map, plan]

  # ---- technique (seeded with the KNOWN collisions from the corpus) --------
  boolean:
    facet: technique
    scope_note: Constructive-solid-geometry union/difference/intersection.
    use_for: [booleans]
    related: [csg]
  csg:
    facet: technique
    scope_note: Constructive Solid Geometry as a modeling paradigm.
    related: [boolean]
  nurbs:
    facet: technique
    use_for: [NURBS]
  brep:
    facet: technique
    scope_note: Boundary representation of solids.
    use_for: [b-rep, B-Rep]
  fillet:
    facet: technique
    use_for: [fillets]
  loops:
    facet: technique
    scope_note: Iteration constructs in a modeling DSL / language.
    use_for: [for-loop, for-loops]
  additive-manufacturing:
    facet: technique
    scope_note: Fabrication by material addition (FDM/SLA/SLS).
    use_for: [3d-printing, layered-manufacturing]
    broader: [manufacturing]
  manufacturing:
    facet: technique
  slicing:
    facet: technique
    scope_note: Converting a model into printer toolpaths (the process).
    related: [slicer]
  slicer:
    facet: technique
    scope_note: The tool that performs slicing (Bambu/Cura/Prusa).
    related: [slicing]
  extrusion:
    facet: technique
    use_for: [extrude]
  sweeps:
    facet: technique
    scope_note: Sweeping a profile along a path to form a solid/surface.
    use_for: [sweep]
  shafts:
    facet: technique
    scope_note: Rotating machine elements that transmit torque.
    use_for: [shaft]

  # ---- material ------------------------------------------------------------
  polymers:
    facet: material
    use_for: [polymer]

  # ---- math ----------------------------------------------------------------
  geometry:
    facet: math
  topology:
    facet: math
  calculus:
    facet: math
  trigonometry:
    facet: math
