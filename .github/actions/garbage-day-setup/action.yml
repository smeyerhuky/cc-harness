# Shared setup for Garbage Day's CI jobs: pnpm from the project's packageManager pin, Node 24,
# the pnpm store cached by lockfile hash, and a frozen-lockfile install.
# Design: projects/garbage-day/kb/design/stack-and-ci.md, "The pipeline".
name: Garbage Day setup
description: Install pnpm and Node, restore the pnpm store, and install the workspace.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: projects/garbage-day/package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: projects/garbage-day/pnpm-lock.yaml
    - name: Install
      shell: bash
      working-directory: projects/garbage-day
      run: pnpm install --frozen-lockfile
