[project]
name = "pipe-monitor-server"
version = "0.1.0"
description = "LAN server for the acoustic pipe monitor: ingest, storage, training, inference."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "pydantic>=2",
    # optional at runtime: asyncpg (Postgres), aiomqtt (broker), pyarrow (Parquet)
]

[project.optional-dependencies]
pg = ["asyncpg>=0.29"]
mqtt = ["aiomqtt>=2"]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
